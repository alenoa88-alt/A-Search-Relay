name: Build Beeper cloud image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./beeper-hostless
          file: ./beeper-hostless/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/alenoa88-alt/a-search-relay/beeper-cloud:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
